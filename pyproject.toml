[project]
name = "prs-its"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgungAryansyah", email = "agungaryansyah2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.8",
    "jupyter>=1.1",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
prs-its = "prs_its:main"
prs-its-train = "prs_its.training:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
