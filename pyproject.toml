[project]
name = "prs-its"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgungAryansyah", email = "agungaryansyah2006@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "catboost>=1.2.8",
    "jupyter>=1.1",
    "matplotlib>=3.10",
    "numpy>=2.2",
    "optuna>=4.0",
    "pandas>=2.2",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "tqdm>=4.67",
    "xgboost>=3.4.1",
    "torch>=2.13.0",
    "tabm>=0.0.3",
    "rtdl-num-embeddings>=0.0.12",
    "tabicl==2.2.0",
]

[project.optional-dependencies]
tabpfn = [
    "tabpfn==8.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[project.scripts]
prs-its = "prs_its:main"
prs-its-train = "prs_its.training:main"
prs-its-xgb-train = "prs_its.xgb_training:main"
prs-its-blend-train = "prs_its.blend_training:main"
prs-its-history-train = "prs_its.history_training:main"
prs-its-tabm-train = "prs_its.tabm_training:main"
prs-its-tabm-tune = "prs_its.tabm_tuning:main"
prs-its-foundation-train = "prs_its.foundation_training:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
